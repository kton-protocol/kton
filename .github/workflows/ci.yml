name: ci

on:
  # `dev` is where work lands; running only on main meant a direct push to the active
  # development branch was ungated, and only PRs were ever checked.
  push:
    branches: [main, dev]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The GATE runs on a SUPPORTED Go line. Go's policy supports a major line until two newer
          # majors exist, and the standard library ships inside every binary we release - having no
          # third-party modules does not remove toolchain maintenance (AUD-13). The `compat` job
          # below still proves the declared `go 1.22` floor in go.mod, so lowering the floor is a
          # deliberate act rather than an accident.
          go-version: 'stable'

      - name: build / test / vet (all three modules)
        run: |
          set -e
          for m in reference nekton/reference kton/reference; do
            echo "== $m =="
            ( cd "$m" && go build ./... && go test ./... && go vet ./... )
          done

      - name: architecture guard (documents-never-executes, one-way deps, WASM-clean kernels)
        run: bash scripts/check-import-direction.sh

      - name: scope guard (the two scope statements must not diverge)
        run: bash scripts/check-scope-drift.sh

      # The guard above reads IMPORTS; this one COMPILES for the browser target. WASM-cleanliness
      # that is only grepped is cleanliness only until something breaks that grep cannot see, and a
      # tag build is the wrong place to find out - it runs after the version is cut. The kernels are
      # the invariant (CONTRIBUTING.md:13); the browser PACKAGE that used to be checked here moved
      # to kton-web with its reproducibility check, but the kernels' obligation stayed behind.
      - name: the kernels still compile for js/wasm
        run: |
          set -e
          ( cd reference        && GOOS=js GOARCH=wasm go build ./... )
          ( cd nekton/reference && GOOS=js GOARCH=wasm go build ./... )

      - name: conformance vectors are frozen (regenerate → expect no diff)
        run: |
          ( cd reference && go run ./testdata/gen )
          git diff --exit-code reference/testdata \
            || { echo "::error::conformance vectors drifted - run 'go run ./testdata/gen' and commit"; exit 1; }

  security-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: build binaries
        run: |
          set -e; mkdir -p "$RUNNER_TEMP/bin"
          ( cd reference        && go build -o "$RUNNER_TEMP/bin/plankton" ./cmd/plankton )
          ( cd nekton/reference && go build -o "$RUNNER_TEMP/bin/nekton"   ./cmd/nekton )
          ( cd kton/reference   && go build -o "$RUNNER_TEMP/bin/kton"     ./cmd/kton )
      - name: checkout kton-examples (for the viewer attack)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: gitmick/kton-examples
          path: kton-examples
      - name: security regression gate (every fixed attack must stay PREVENTED)
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          bash security/check.sh "$GITHUB_WORKSPACE/kton-examples"

  # The floor, proven rather than declared. Each go.mod says `go 1.22`; this job is what makes that
  # true. It builds and tests only - the guards, WASM builds, conformance vectors and security gate
  # all run once, above, on the supported line.
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: the declared minimum Go line still builds and tests
        run: |
          set -e
          for m in reference nekton/reference kton/reference; do
            echo "== $m =="
            ( cd "$m" && go build ./... && go test ./... )
          done
